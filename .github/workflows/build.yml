name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip openjdk-17-jdk \
          build-essential autoconf libtool pkg-config

          pip install --upgrade pip
          pip install cython==0.29.37 buildozer==1.6.0 virtualenv

      - name: Clean buildozer cache
        run: rm -rf .buildozer

      - name: Build APK (force verbose)
        run: |
          buildozer -v android debug || true

      - name: Show logs if failed
        if: failure()
        run: |
          ls -R .buildozer || true
