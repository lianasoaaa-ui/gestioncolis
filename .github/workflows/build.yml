name: Build APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk \
          build-essential autoconf libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.37 buildozer==1.6.0 virtualenv

      - name: Prepare Buildozer
        run: |
          mkdir -p ~/.buildozer
          rm -rf .buildozer

      - name: Build APK (force SDK download)
        env:
          P4A_FORCE_BOOTSTRAP: sdl2
        run: |
          buildozer android debug

      - name: Show output
        run: |
          ls -R bin || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
